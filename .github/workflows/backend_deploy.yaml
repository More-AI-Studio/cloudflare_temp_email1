name: Deploy Backend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      # Разрешаем lifecycle-скрипты нужных пакетов
      - name: Configure pnpm build scripts
        run: |
          pnpm config set only-built-dependencies "esbuild,workerd,core-js-pure,es5-ext"

      - name: Deploy Backend for ${{ github.ref_name }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}
          USE_WORKER_ASSETS: ${{ secrets.USE_WORKER_ASSETS }}
          USE_WORKER_ASSETS_WITH_TELEGRAM: ${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}
          DEBUG_MODE: ${{ secrets.DEBUG_MODE }}
          BACKEND_USE_MAIL_WASM_PARSER: ${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}

        run: |
          set -e

          echo "========================================"
          echo "Starting deployment"
          echo "========================================"

          # -----------------------------
          # Frontend
          # -----------------------------
          if [ -n "$USE_WORKER_ASSETS" ]; then
            echo "Building frontend..."

            cd frontend/

            pnpm install --no-frozen-lockfile

            if [ -n "$USE_WORKER_ASSETS_WITH_TELEGRAM" ]; then
              echo "Building with telegram pages"
              pnpm build:telegram:pages
            else
              echo "Building with normal pages"
              pnpm build:pages
            fi

            cd ..
          else
            echo "Frontend build skipped"
          fi

          # -----------------------------
          # Backend
          # -----------------------------
          echo "Installing backend dependencies..."

          cd worker/

          # Проверяем, что конфигурация действительно существует
          if [ -z "$WRANGLER_TOML_CONTENT" ]; then
            echo "ERROR: BACKEND_TOML secret is empty"
            exit 1
          fi

          printf '%s\n' "$WRANGLER_TOML_CONTENT" > wrangler.toml

          echo "wrangler.toml created"

          pnpm install --no-frozen-lockfile

          # -----------------------------
          # Mail parser
          # -----------------------------
          if [ -n "$BACKEND_USE_MAIL_WASM_PARSER" ]; then
            echo "Using mail-parser-wasm-worker"

            pnpm add mail-parser-wasm-worker

            git apply ../.github/config/mail-parser-wasm-worker.patch

            echo "Applied mail-parser-wasm-worker patch"
          fi

          # -----------------------------
          # Deploy
          # -----------------------------
          echo "========================================"
          echo "Running deploy..."
          echo "========================================"

          # НЕ скрываем вывод!
          pnpm run deploy

          echo "========================================"
          echo "Deploy completed successfully"
          echo "========================================"

          echo "Deployed for tag ${{ github.ref_name }}"
